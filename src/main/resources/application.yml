spring:
  application:
    name: hl7-decoder
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hl7decoder}
    username: ${DATABASE_USERNAME:hl7decoder}
    password: ${DATABASE_PASSWORD:hl7decoder}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SECURE_COOKIES:false}
        same-site: strict

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  encryption-key: ${ENCRYPTION_KEY:local-dev-key-change-me}
  saved-message-cleanup-ms: ${SAVED_MESSAGE_CLEANUP_MS:3600000}
  api:
    version: v1
    rate-limit-per-minute: ${API_RATE_LIMIT_PER_MINUTE:120}
  ai:
    provider: ${AI_PROVIDER:local}
    local-only: ${AI_LOCAL_ONLY:true}
    mask-phi: ${AI_MASK_PHI:true}
    default-model: ${AI_DEFAULT_MODEL:healthcare-hero-local-rules}
  cache:
    provider: ${CACHE_PROVIDER:local}
    redis-url: ${REDIS_URL:}
  features:
    dashboard: ${FEATURE_DASHBOARD_ENABLED:true}
    workspaces: ${FEATURE_WORKSPACES_ENABLED:true}
    ai-assist: ${FEATURE_AI_ASSIST_ENABLED:true}
    admin-imports: ${FEATURE_ADMIN_IMPORTS_ENABLED:true}
    platform-tools: ${FEATURE_PLATFORM_TOOLS_ENABLED:true}
    dark-mode: ${FEATURE_DARK_MODE_ENABLED:true}
  security:
    jwt-secret: ${JWT_SECRET:dev-change-me-healthcare-hero}
    token-ttl-minutes: ${TOKEN_TTL_MINUTES:480}
    idle-timeout-minutes: ${IDLE_TIMEOUT_MINUTES:30}
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
  icd10:
    api-base-url: ${ICD10_API_BASE_URL:https://clinicaltables.nlm.nih.gov/api/icd10cm/v3/search}

logging:
  level:
    root: INFO
    com.hl7decoder: INFO
